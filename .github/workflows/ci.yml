name: Swift and simulator builds

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test-and-build:
    # Standard public arm64 runner, currently preview; no fallback toolchain.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      # Official actions/checkout v6 tag resolved to this immutable commit:
      # https://github.com/actions/checkout/commit/d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Python availability and offline fixtures
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Verify selected Xcode, Swift, SDKs and runtimes
        run: |
          set -euo pipefail
          python3 -B scripts/ci/check_ci.py preflight

      - name: Run complete Swift core test suite
        run: |
          set -euo pipefail
          xcrun swift test --package-path Packages/GrokBotWatchCore 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Clean unsigned iOS simulator build and embedded Watch verification
        run: |
          set -euo pipefail
          derived_data="$(mktemp -d "$RUNNER_TEMP/grokbotwatch-ios.XXXXXX")"
          xcodebuild -project GrokBotWatch.xcodeproj -scheme GrokBotWatch \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO clean build \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          python3 -B scripts/ci/check_ci.py embedded-app --derived-data "$derived_data"

      - name: Clean unsigned watchOS simulator build
        run: |
          set -euo pipefail
          derived_data="$(mktemp -d "$RUNNER_TEMP/grokbotwatch-watchos.XXXXXX")"
          xcodebuild -project GrokBotWatch.xcodeproj -scheme 'GrokBotWatch Watch' \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO clean build \
            2>&1 | tee "$RUNNER_TEMP/watchos-build.log"
